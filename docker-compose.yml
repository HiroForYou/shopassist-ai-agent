name: ai-agentic

services:
  # Servidor de modelos local (CPU). Para GPU NVIDIA ver docs/fase-00-setup.md
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      # Mantiene los modelos cargados entre llamadas (evita recargar chat/embeddings en cada turno)
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Job manual: descarga/actualiza los modelos definidos en .env. NO es dependencia de `app`:
  # un pull puede cambiar los pesos de un tag (qwen3.5:4b) y romper la comparabilidad entre experimentos.
  # Ejecutar explicitamente: docker compose run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["tools"]  # nunca arranca con `docker compose up`; solo con `run` explicito
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${OLLAMA_MODEL:-qwen3.5:4b} &&
        ollama pull ${OLLAMA_FALLBACK_MODEL:-granite4.1:3b} &&
        ollama pull ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
    volumes:
      - ollama_data:/root/.ollama

  # Vector DB (Fase 3). Dashboard: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Contenedor de trabajo: ejecuta scripts y tests de cada fase
  app:
    build: .
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      API_URL: http://api:8000
    volumes:
      - ./:/app
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    stdin_open: true
    tty: true

  # API HTTP con streaming (Fase 7): http://localhost:8000/docs
  api:
    build: .
    container_name: shopassist-api
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    command: ["uvicorn", "agentic.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s  # el warm-up carga los modelos en CPU antes de aceptar trafico
    restart: unless-stopped

  # Monitoreo (Fase 7). Arranque: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    environment:
      # Solo para uso local: acceso anonimo como admin, sin login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
